{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Пользователи</h1>
<a href="/admin/users/new" class="btn btn-primary btn-sm mb-3">Добавить</a>
<table class="table table-striped">
    <thead><tr><th>Email</th><th>Имя</th><th>Роль</th><th>Группа</th></tr></thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.email }}</td>
            <td>{{ u.full_name }}</td>
            <td>{{ u.role.value }}</td>
            <td>{{ u.group.name if u.group else '—' }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
