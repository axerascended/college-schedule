{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ title }}</h1>
<form method="post">
    {% for field in form_fields %}
    <div class="mb-3">
        <label class="form-label" for="{{ field.name }}">{{ field.label }}</label>
        <input type="{{ field.type|default('text') }}" class="form-control" id="{{ field.name }}"
               name="{{ field.name }}" value="{{ field.value|default('', true) }}" {% if field.required %}required{% endif %}>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
